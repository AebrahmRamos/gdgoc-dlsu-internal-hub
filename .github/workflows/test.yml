name: Test Security Rules

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Run Security Rules Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gdg-dlsu-hub/package-lock.json
      
      # Cache Firebase emulator binaries (speeds up CI by ~2-3 minutes)
      - name: Cache Firebase Emulator
        uses: actions/cache@v3
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('gdg-dlsu-hub/firebase.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-
      
      - name: Install dependencies
        working-directory: gdg-dlsu-hub
        run: npm ci
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Run Firestore security rules tests
        working-directory: gdg-dlsu-hub
        run: |
          firebase emulators:exec --only firestore --project test-gdgoc-dlsu-hub 'npm test'
      
      - name: Test Summary
        if: always()
        run: |
          echo "✅ Security rules tests completed!"
          echo "Check the logs above for detailed results."
